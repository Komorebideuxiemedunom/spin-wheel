<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roue des Jeux</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #2d1b69 0%, #1a0f3d 70%);
  font-family: -apple-system, "Segoe UI", Arial, sans-serif;
}
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.5rem;
  padding: 2rem;
}
.wheel-wrap {
  position: relative;
  width: min(420px, 82vw);
  height: min(420px, 82vw);
}
.pointer {
  position: absolute;
  top: -18px;
  left: 50%;
  width: 0;
  height: 0;
  transform: translateX(-50%);
  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-top: 28px solid #ffffff;
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
  z-index: 3;
}
.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  background: conic-gradient(
    from 0deg,
    #8b5cf6 0deg 51.429deg,
    #6d5bd0 51.429deg 102.857deg,
    #a855f7 102.857deg 154.286deg,
    #252a52 154.286deg 205.714deg,
    #4c4a8a 205.714deg 257.143deg,
    #7c3aed 257.143deg 308.571deg,
    #5b21b6 308.571deg 360deg
  );
  box-shadow:
    0 0 40px 8px rgba(139, 92, 246, 0.55),
    0 0 90px 25px rgba(139, 92, 246, 0.3),
    inset 0 0 30px rgba(0, 0, 0, 0.35);
  transition: transform 4s cubic-bezier(.17, .67, .12, .99);
  overflow: hidden;
}
.wedge-highlight {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.2) 55%, transparent 78%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
.wedge-highlight.show { opacity: 1; }
.logo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 56px;
  height: 56px;
  margin: -28px 0 0 -28px;
  opacity: 0.95;
  filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.4));
}
.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.logo.l0 { transform: rotate(25.714deg) translate(0, -140px) rotate(-25.714deg); }
.logo.l1 { transform: rotate(77.143deg) translate(0, -140px) rotate(-77.143deg); }
.logo.l2 { transform: rotate(128.571deg) translate(0, -140px) rotate(-128.571deg); }
.logo.l3 { transform: rotate(180deg) translate(0, -140px) rotate(-180deg); }
.logo.l4 { transform: rotate(231.429deg) translate(0, -140px) rotate(-231.429deg); }
.logo.l5 { transform: rotate(282.857deg) translate(0, -140px) rotate(-282.857deg); }
.logo.l6 { transform: rotate(334.286deg) translate(0, -140px) rotate(-334.286deg); }
.result-overlay {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10, 6, 30, 0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  z-index: 4;
}
.result-overlay.show { opacity: 1; }
.result-name {
  color: #ffffff;
  font-weight: 800;
  font-size: clamp(1.05rem, 4.8vw, 1.5rem);
  text-align: center;
  padding: 0 1.4rem;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);
  opacity: 0;
  transform: translateY(6px) scale(0.94);
  transition: opacity 0.4s ease 0.15s, transform 0.4s ease 0.15s;
}
.result-overlay.show .result-name {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.star {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 34px;
  height: 34px;
  margin: -17px 0 0 -17px;
  background: #ffffff;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
  box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.7);
  z-index: 2;
}
#spinBtn {
  border: none;
  border-radius: 999px;
  padding: 0.9rem 3rem;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #ffffff;
  background: linear-gradient(135deg, #8b5cf6, #6d28d9);
  box-shadow: 0 0 25px rgba(139, 92, 246, 0.6);
  cursor: pointer;
}
#spinBtn:hover { box-shadow: 0 0 34px rgba(139, 92, 246, 0.8); }
#spinBtn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
#spinBtn:active {
  transform: scale(0.97);
}
@media (prefers-reduced-motion: reduce) {
  .wheel { transition: none; }
  .wedge-highlight, .result-overlay, .result-name { transition: none; }
}
@media (max-width: 480px) {
  #spinBtn {
    padding: 0.8rem 2.4rem;
    font-size: 0.95rem;
  }
}
</style>
</head>

<script>
const GAMES = ['League of Legends', 'Counter-Strike', 'Rocket League', 'Fortnite', 'Valorant', 'Battle.net', 'Dofus'];
const SEGMENT_SIZE = 360 / GAMES.length;

const wheel = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
const wedgeHighlight = document.getElementById('wedgeHighlight');
const resultOverlay = document.getElementById('resultOverlay');
const resultName = document.getElementById('resultName');

let rotation = 0;
let revealTimer = null;

function wedgeClipPath(index) {
  const r = 300;
  const toPoint = (deg) => {
    const rad = (deg * Math.PI) / 180;
    const x = 50 + r * Math.sin(rad);
    const y = 50 - r * Math.cos(rad);
    return `${x}% ${y}%`;
  };
  const a0 = index * SEGMENT_SIZE;
  const a1 = a0 + SEGMENT_SIZE;
  return `polygon(50% 50%, ${toPoint(a0)}, ${toPoint(a1)})`;
}

function resetResult() {
  wedgeHighlight.classList.remove('show');
  resultOverlay.classList.remove('show');
}

spinBtn.addEventListener('click', () => {
  clearTimeout(revealTimer);
  resetResult();
  spinBtn.disabled = true;
  const randomAngle = Math.random() * 360;
  rotation += 360 * 5 + randomAngle;
  wheel.style.transform = `rotate(${rotation}deg)`;
  revealTimer = setTimeout(() => {
    const normalized = ((360 - (rotation % 360)) % 360 + 360) % 360;
    const index = Math.floor(normalized / SEGMENT_SIZE) % GAMES.length;
    wedgeHighlight.style.clipPath = wedgeClipPath(index);
    wedgeHighlight.classList.add('show');
    resultName.textContent = GAMES[index];
    resultOverlay.classList.add('show');
    spinBtn.disabled = false;
  }, 4000);
});
</script>
