<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roue des Jeux</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #2d1b69 0%, #1a0f3d 70%);
  font-family: -apple-system, "Segoe UI", Arial, sans-serif;
}
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.5rem;
  padding: 2rem;
}
.wheel-wrap {
  position: relative;
  width: min(420px, 82vw);
  height: min(420px, 82vw);
}
.pointer {
  position: absolute;
  top: -18px;
  left: 50%;
  width: 0;
  height: 0;
  transform: translateX(-50%);
  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-top: 28px solid #ffffff;
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
  z-index: 3;
}
.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  background: conic-gradient(
    from 0deg,
    #8b5cf6 0deg 60deg,
    #6d5bd0 60deg 120deg,
    #a855f7 120deg 180deg,
    #252a52 180deg 240deg,
    #4c4a8a 240deg 300deg,
    #7c3aed 300deg 360deg
  );
  box-shadow:
    0 0 40px 8px rgba(139, 92, 246, 0.55),
    0 0 90px 25px rgba(139, 92, 246, 0.3),
    inset 0 0 30px rgba(0, 0, 0, 0.35);
  transition: transform 4s cubic-bezier(.17, .67, .12, .99);
}
.logo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 56px;
  height: 56px;
  margin: -28px 0 0 -28px;
  opacity: 0.95;
  filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.4));
}
.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.logo.l0 { transform: rotate(30deg) translate(0, -140px) rotate(-30deg); }
.logo.l1 { transform: rotate(90deg) translate(0, -140px) rotate(-90deg); }
.logo.l2 { transform: rotate(150deg) translate(0, -140px) rotate(-150deg); }
.logo.l3 { transform: rotate(210deg) translate(0, -140px) rotate(-210deg); }
.logo.l4 { transform: rotate(270deg) translate(0, -140px) rotate(-270deg); }
.logo.l5 { transform: rotate(330deg) translate(0, -140px) rotate(-330deg); }
.star {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 34px;
  height: 34px;
  margin: -17px 0 0 -17px;
  background: #ffffff;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
  box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.7);
  z-index: 2;
}
#spinBtn {
  border: none;
  border-radius: 999px;
  padding: 0.9rem 3rem;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #ffffff;
  background: linear-gradient(135deg, #8b5cf6, #6d28d9);
  box-shadow: 0 0 25px rgba(139, 92, 246, 0.6);
  cursor: pointer;
}
#spinBtn:hover { box-shadow: 0 0 34px rgba(139, 92, 246, 0.8); }
#spinBtn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
#spinBtn:active {
  transform: scale(0.97);
}
@media (prefers-reduced-motion: reduce) {
  .wheel { transition: none; }
}
@media (max-width: 480px) {
  #spinBtn {
    padding: 0.8rem 2.4rem;
    font-size: 0.95rem;
  }
}
</style>
</head>

<script>
let rotation = 0;
const wheel = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
spinBtn.addEventListener('click', () => {
  spinBtn.disabled = true;
  const randomAngle = Math.floor(Math.random() * 360);
  rotation += 360 * 5 + randomAngle;
  wheel.style.transform = `rotate(${rotation}deg)`;
  setTimeout(() => { spinBtn.disabled = false; }, 4000);
});
</script>

</html>
